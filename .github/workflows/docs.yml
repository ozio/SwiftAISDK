name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test

  build:
    needs: test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Show Swift version
        run: swift --version

      - name: Install docs dependencies
        run: npm ci --prefix docs-site

      - name: Build package
        run: swift build

      - name: Build documentation examples
        run: swift build --package-path Examples

      - name: Build docs
        run: npm --prefix docs-site run build
        env:
          DOCS_BASE: /SwiftAISDK
          DOCS_SITE: https://ozio.github.io

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-${{ github.run_id }}
          path: docs-site/dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: macos-26
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: docs-site-${{ github.run_id }}
          path: docs-site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
